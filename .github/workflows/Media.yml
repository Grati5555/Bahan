name: IPTV Playlist Bot

on:
  schedule:
    - cron: '0 */6 * * *' # Berjalan otomatis tiap 6 jam
  workflow_dispatch:      # Tombol run manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Script
        run: python main.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'chore: automated playlist merge, validation, and report [skip ci]'
          branch: main
